name: SPC Outlook Story Generator

on:
  schedule:
    # ~30-40 min after each SPC Day 1 Outlook issuance (0600z, 1300z, 1630z, 2000z, 0100z UTC)
    - cron: "35 6 * * *"
    - cron: "35 13 * * *"
    - cron: "50 16 * * *"
    - cron: "35 20 * * *"
    - cron: "35 1 * * *"
  workflow_dispatch: {} # lets you trigger it manually to test

# Prevents overlapping runs from racing each other on the heartbeat push.
concurrency:
  group: spc-outlook-story
  cancel-in-progress: false

permissions:
  contents: write # needed to commit/push the heartbeat file (see below)

jobs:
  generate:
    # Adjust this label to match whatever you tagged your self-hosted M1 runner with.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        # actions/checkout persists a token-authenticated remote by default,
        # which is what lets `git push` below work without extra setup.

      - name: Install dependencies
        run: pip3 install --user -r requirements.txt

      # The generated slides never touch GitHub at all now -- the script
      # writes them straight to a folder on this Mac (outside the repo
      # checkout) that site/server.py serves over the Cloudflare Tunnel.
      # No SPC_STORY_OUTPUT_DIR override here, so it uses the script's own
      # default (~/spc-outlook-site/stories), which must match whatever
      # deploy/install.sh configured the local web server to serve.
      - name: Generate story slides if risk is Enhanced+ or a hatched tornado area is present
        env:
          SPC_NTFY_TOPIC: ${{ secrets.SPC_NTFY_TOPIC }}
          SPC_STORY_SITE_URL: ${{ vars.SPC_STORY_SITE_URL }}
        run: python3 spc_story_generator.py

      # main requires PRs + review, so the bot can't push here -- and this
      # repo has no images to commit anymore anyway. This step only touches
      # a one-line timestamp file on the separate, unprotected `stories`
      # branch, purely so *some* commit activity happens on every run
      # (trigger or not): GitHub auto-disables a scheduled workflow after
      # 60 days with no repo commits, and without this, a quiet stretch of
      # sub-Enhanced weather would silently kill the schedule.
      - name: Heartbeat commit (no pictures -- keeps the schedule from auto-disabling)
        run: |
          git worktree prune
          if git ls-remote --exit-code --heads origin stories >/dev/null 2>&1; then
            git fetch origin stories
            git worktree add stories-branch origin/stories -B stories
          else
            git worktree add --detach stories-branch
            git -C stories-branch checkout --orphan stories
            git -C stories-branch rm -rf . >/dev/null 2>&1 || true
          fi

          cd stories-branch
          date -u +"%Y-%m-%dT%H:%M:%SZ last run" > heartbeat.txt
          git config user.name "spc-outlook-bot"
          git config user.email "spc-outlook-bot@users.noreply.github.com"
          git add heartbeat.txt
          if git diff --cached --quiet; then
            echo "Heartbeat unchanged -- nothing to commit."
          else
            git commit -m "Heartbeat: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin stories
          fi

      - name: Clean up stories worktree
        if: always()
        run: git worktree remove stories-branch --force || true
